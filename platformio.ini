[platformio]
default_envs = cubecell_board
src_dir = src
include_dir = include
lib_dir = lib
test_dir = test

; =============================================================================
; Common Build Configuration
; =============================================================================

[common_embedded]
build_flags =
    ; Explicit C++ standard (platform default otherwise)
    -std=gnu++17
    ; Suppress all framework warnings (framework has many issues)
    -w
    ; Size optimization
    -fno-exceptions
    -ffunction-sections
    -fdata-sections
    -fmerge-all-constants
    -Os
build_src_flags =
    ; C++ only flags
    -fno-rtti
    ; Strict warnings for OUR code only
    -Wall
    -Wextra
    -Werror
    -Wshadow
    -Wformat=2
    -Wcast-align
    -Wstack-usage=2048
    -fstack-protector-strong
    -fno-common
build_unflags =
    -std=gnu++11

; =============================================================================
; CubeCell Device (Heltec ASR6501/ASR6502)
; =============================================================================

[env:cubecell_board]
platform = heltec-cubecell
board = cubecell_board
framework = arduino
monitor_speed = 115200
build_flags =
    ${common_embedded.build_flags}
    -DNDEBUG
build_src_flags =
    ${common_embedded.build_src_flags}
build_unflags =
    ${common_embedded.build_unflags}
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem
lib_deps =
    EEPROM @ 1.0

[env:cubecell_board_debug]
platform = heltec-cubecell
board = cubecell_board
framework = arduino
monitor_speed = 115200
build_flags =
    ${common_embedded.build_flags}
    -DDEBUG_BUILD
    -g3
build_src_flags =
    ${common_embedded.build_src_flags}
build_unflags =
    ${common_embedded.build_unflags}
build_type = debug

[env:cubecell_board_test]
platform = heltec-cubecell
board = cubecell_board
framework = arduino
monitor_speed = 115200
build_flags =
    ${common_embedded.build_flags}
    -DTEST_BUILD
build_src_flags =
    ${common_embedded.build_src_flags}
build_unflags =
    ${common_embedded.build_unflags}
build_src_filter = +<*> -<main.cpp>
test_build_src = true
test_ignore = test_native
lib_deps =
    EEPROM @ 1.0

; =============================================================================
; Native Environment (for unit testing on host)
; =============================================================================

[env:native]
platform = native@~1.2.1
check_tool = cppcheck
check_flags = --enable=warning,style,performance --suppress=unusedFunction --suppress=noExplicitConstructor --suppress=unreadVariable --suppress=knownConditionTrueFalse --suppress=useStlAlgorithm
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Wshadow
    -Wformat=2
    -Wcast-align
    -Wnull-dereference
    -fstack-protector-strong
    -fno-common
    -DNATIVE_BUILD
    -DUNITY_INCLUDE_CONFIG_H
build_src_filter =
    +<packet/packet.cpp>
    +<packet/packet_history.cpp>
    +<crypto/crypto_types.cpp>
    +<crypto/ed25519_crypto.cpp>
    +<crypto/identity_manager.cpp>
    +<time/time_sync.cpp>
    +<routing/repeater.cpp>
    +<routing/packet_router.cpp>
    +<queue/tx_queue.cpp>
    +<radio/radio_controller.cpp>
    +<power/power_save.cpp>
    +<util/noise_floor_estimator.cpp>
    +<prefs/path_hash_mode.cpp>
test_framework = unity
test_build_src = true
test_ignore = test_embedded

; =============================================================================
; Native with coverage (gcov/lcov) – extends env:native, adds --coverage
; =============================================================================

[env:native_coverage]
extends = env:native
build_flags = ${env:native.build_flags} --coverage

; =============================================================================
; NEW DEVICE TEMPLATE
; =============================================================================
; To add a new device, copy and modify this template:
;
; [env:your_device_name]
; platform = <platform>           ; e.g., espressif32, nordicnrf52
; board = <board>                 ; e.g., esp32dev, nrf52840_dk
; framework = arduino
; monitor_speed = 115200
; build_flags =
;     ${common_embedded.build_flags}
;     -D<YOUR_DEVICE_MACRO>       ; e.g., -DESP32, -DNRF52840
;     -DNDEBUG
; build_src_flags =
;     ${common_embedded.build_src_flags}
; build_unflags =
;     ${common_embedded.build_unflags}
; lib_deps =
;     ; Add device-specific library dependencies
;
; Then create HAL implementations in src/hal/<device_name>/
; See src/hal/template/DEVICE_TEMPLATE.md for details.
; =============================================================================
